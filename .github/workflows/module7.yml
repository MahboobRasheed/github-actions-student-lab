
name: Module 7 - Custom JavaScript Action

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-custom-action:
    runs-on: ubuntu-latest

    steps:
      - name: Execute Custom Greeting Action
        id: greeting
        uses: MahboobRasheed/github-actions-greeting-action@v1.0.0
        with:
          name: "Mahboob Rasheed"
          greeting: "Hello"

      - name: Display Custom Action Output
        env:
          GREETING_MESSAGE: ${{ steps.greeting.outputs.message }}
        run: |
          echo "Custom Action Output: $GREETING_MESSAGE"
          test "$GREETING_MESSAGE" = "Hello, Mahboob Rasheed!"

      - name: Success Message
        run: |
          echo "Module 7 completed successfully!"
